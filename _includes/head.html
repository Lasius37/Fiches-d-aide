<title>{{ page.short | escape }}</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="{{ '/images/favicon.ico' | relative_url }}">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/css/specifics/index.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/css/media-queries.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/css/specifics/' | append: page.tag | append: '.css' | relative_url }}">
{% if page.tag == "index" %}
    <script type="module" src="{{ '/js/script.js' | relative_url }}"></script>
{% endif %}
